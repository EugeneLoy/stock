<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Стокові зображення</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">

  <div class="container py-4">
    <h1 class="h4 mb-4">Стокові зображення</h1>
    <div class="accordion" id="categoriesAccordion"></div>
  </div>

  <!-- Toast -->
  <div class="position-fixed bottom-0 start-0 end-0 p-3" style="z-index: 1100">
    <div id="copyToast" class="toast align-items-center text-bg-success border-0 w-100" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">URL скопійовано до буфера обміну.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const accordion = document.getElementById('categoriesAccordion');
    const toastEl = document.getElementById('copyToast');
    const toast = new bootstrap.Toast(toastEl, { delay: 2000 });

    function copyUrl(url) {
      const fullUrl = `${location.origin}${url}`;
      navigator.clipboard.writeText(fullUrl).then(() => toast.show());
    }

    function buildAccordion(categories) {
      categories.forEach((category, idx) => {
        const collapseId = `collapse-${idx}`;
        const headingId = `heading-${idx}`;
        const isFirst = idx === 0;

        const rows = category.images.map(img => `
          <tr>
            <td style="width:70%" class="text-center align-middle p-2">
              <img src="${img.url}" class="img-fluid" alt="${img.url}" />
            </td>
            <td style="width:30%" class="text-center align-middle p-2">
              <button class="btn btn-sm btn-outline-secondary" onclick="copyUrl('${img.url}')">Копіювати URL</button>
            </td>
          </tr>
        `).join('');

        const item = document.createElement('div');
        item.className = 'accordion-item';
        item.innerHTML = `
          <h2 class="accordion-header" id="${headingId}">
            <button class="accordion-button ${isFirst ? '' : 'collapsed'}" type="button"
              data-bs-toggle="collapse" data-bs-target="#${collapseId}"
              aria-expanded="${isFirst}" aria-controls="${collapseId}">
              ${category.categoryName}
            </button>
          </h2>
          <div id="${collapseId}" class="accordion-collapse collapse ${isFirst ? 'show' : ''}"
            aria-labelledby="${headingId}" data-bs-parent="#categoriesAccordion">
            <div class="accordion-body p-0">
              <table class="table table-borderless mb-0">
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
        accordion.appendChild(item);
      });
    }

    fetch('config.json')
      .then(r => r.json())
      .then(buildAccordion)
      .catch(err => {
        accordion.innerHTML = `<div class="alert alert-danger">Не вдалося завантажити config.json: ${err.message}</div>`;
      });
  </script>
</body>
</html>
